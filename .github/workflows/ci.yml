name: CI

# P5 gate: the SAME suite must go green against at least two different ffmpeg
# builds — the distro's (apt) and a pinned static GPL build with different
# encoder availability. qpdf/pandoc/poppler/gs/LaTeX come from apt so the
# real-engine tests (tests/test_real_external_engines.py) actually RUN here,
# and a step fails the job if they skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ffmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: [distro, static-7.1]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: External engines (system packages - the app bundles zero engines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qpdf pandoc poppler-utils ghostscript \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            libreoffice-writer \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: "ffmpeg flavour: distro (apt build)"
        if: matrix.ffmpeg == 'distro'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: "ffmpeg flavour: pinned static build (BtbN FFmpeg-n7.1.1 GPL)"
        if: matrix.ffmpeg == 'static-7.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tag is pinned; asset names embed a build hash, so glob them.
          gh release download FFmpeg-n7.1.1 --repo BtbN/FFmpeg-Builds \
            --pattern 'ffmpeg-n7.1*-linux64-gpl-7.1.tar.xz' --dir /tmp/ff
          mkdir -p /opt/ffmpeg
          tar -xf /tmp/ff/ffmpeg-n7.1*-linux64-gpl-7.1.tar.xz \
            -C /opt/ffmpeg --strip-components=1
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Show the engine matrix this job really has
        run: |
          set -euo pipefail
          command -v ffmpeg; ffmpeg -version | head -2
          command -v ffprobe
          qpdf --version | head -1
          pandoc --version | head -1
          pdftoppm -v 2>&1 | head -1 || true
          gs --version
          command -v pdflatex

      - name: Install the app (Python deps only; engines stay external)
        run: pip install -e ".[dev,gui]"

      - name: Test suite (all tiers except slow)
        run: python -m pytest -q -m "not slow"

      - name: Real-engine coverage must RUN, not skip
        run: |
          set -euo pipefail
          out=$(python -m pytest -q tests/test_real_external_engines.py -rs 2>&1)
          echo "$out"
          if echo "$out" | grep -qi skipped; then
            echo "::error::qpdf/pandoc real tests skipped on CI - coverage missing"
            exit 1
          fi

  # P6 gate: the SAME suite goes green on Windows, and the Windows governor
  # load test (real Job Object, real busy-loop children, measured CPU) RUNS -
  # a step fails if it skips. Documented deviations on this runner:
  #  - no qpdf/pandoc (no enforced apt chain like Linux); real-engine tests
  #    skip honestly there and the zero-skip enforcement step is Linux-only.
  #    Local Windows QA with the full engine set stays on the roadmap.
  #  - ffmpeg/ghostscript ship on the GitHub Windows image; whatever the
  #    runtime probe finds is what the tests exercise (measure, don't parse).
  windows:
    name: Windows (Job Object governor)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app (Python deps only; engines stay external)
        run: pip install -e ".[dev,gui]"

      - name: Show what the runtime probe really finds (no assumptions)
        run: |
          python -c "from transmute.probe.engines import EngineManager; [print(r['name'], r['status'], r['path'], r['version'], sep=' | ') for r in EngineManager().status_table()]"

      - name: Test suite (all tiers except slow)
        run: python -m pytest -q -m "not slow"

      - name: Governor load test - real Job Object cap must RUN and hold
        shell: pwsh
        timeout-minutes: 12
        run: |
          python -m pytest -q tests/test_governor_windows.py -rs | Tee-Object -FilePath wjo.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }   # cap assertion failed
          if (Select-String -Path wjo.log -Pattern "skipped" -Quiet) {
            echo "::error::Windows governor load test skipped - gate not covered"
            exit 1
          }
