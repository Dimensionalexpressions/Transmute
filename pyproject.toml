[project]
name = "transmute"
version = "0.2.6.1"
description = "Transmute - open-source media & document converter that adapts to the machine it runs on (runtime capability probing, verify-before-replace, resource governor)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FUAL-1.0" }
authors = [{ name = "Coty Julien", email = "kieros@cekfam.com" }]
keywords = ["converter", "ffmpeg", "av1", "webp", "opus", "pdf", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia",
]

# Runtime dependencies are deliberately minimal and all Apache/MIT/BSD-class or
# otherwise redistributable-SDK Python packages. Engines (ffmpeg, ghostscript,
# qpdf, LibreOffice, poppler, pandoc) are EXTERNAL system processes: the
# bundle ships zero codec/engine binaries (see LICENSES.md, F26).
dependencies = [
    "Pillow>=10",
    "pikepdf>=8",
    "psutil>=5.9",
    "platformdirs>=4",
    "watchdog>=6",  # F24 watch folders: inotify on Linux, RDCW on Windows (P6)
    # Serve is a built-in button of the shipped GUI (2026-11 field bug: v0.2.5
    # frozen builds carried the button but NOT these deps - clicking it died
    # with "No module named 'uvicorn'" and the dialog snapped back to off).
    # They were already imported unconditionally by src/transmute/serve;
    # declaring them here is what puts them INSIDE the bundle.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
gui = [
    "PySide6>=6.6",
]
# Serve mode (Phase B): HTTP front door onto the SAME core as the GUI.
# python-multipart is required by FastAPI to parse multipart/form-data
# uploads - it is part of "fastapi with file upload", not a feature choice.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "unit: fast, hermetic (no external engines required)",
    "e2e: end-to-end smoke tests that require real system engines (ffmpeg etc.)",
    "slow: takes more than a few seconds",
]
