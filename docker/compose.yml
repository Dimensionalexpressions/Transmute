# Transmute serve as a service. Start with:   docker compose up -d --build
# Then open the link it prints:                docker compose logs transmute
services:
  transmute:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: transmute-serve:local
    ports:
      - "8765:8765"                # the browser port; keep or change freely
    volumes:
      - ./transmute-data:/data     # uploads, outputs, journals - survives rebuilds
    environment:
      # Pick your own password; with this line commented out Transmute makes
      # one up and prints the ready-to-open link once, in the logs above.
      # TRANSMUTE_TOKEN: change-me
      # TRANSMUTE_MAX_UPLOAD_MB: 2048
      {}
    restart: unless-stopped
    # GPU conversions: install the NVIDIA Container Toolkit, then uncomment.
    # Without it the container probes honestly and offers CPU encoders only.
    # runtime: nvidia
    # Run as your host user so ./transmute-data stays yours:
    # user: "1000:1000"
