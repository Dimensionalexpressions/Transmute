<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242c37"/>
      <stop offset="1" stop-color="#10151b"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59e6a7"/>
      <stop offset="1" stop-color="#25b3c4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="216" fill="url(#tile)"/>
  <rect x="16" y="16" width="992" height="992" rx="216" fill="none"
        stroke="#323d4b" stroke-width="8"/>
  <!-- transmutation hourglass: solve et coagula, solve et coagula -->
  <g fill="none" stroke="url(#glyph)" stroke-width="60"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M 300 236 L 724 236 L 512 484 Z"/>
    <path d="M 512 540 L 300 788 L 724 788 Z"/>
  </g>
  <!-- the drop that transmutes: a small seed between the halves -->
  <circle cx="512" cy="512" r="34" fill="url(#glyph)"/>
</svg>
