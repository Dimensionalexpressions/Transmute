name: CI

# P5 gate: the SAME suite must go green against at least two different ffmpeg
# builds — the distro's (apt) and nixpkgs' pinned ffmpeg_7 (7.1.x, a different
# build configuration with different encoder availability). qpdf/pandoc/
# poppler/gs/LaTeX come from apt so the real-engine tests
# (tests/test_real_external_engines.py) actually RUN here, and a step fails the
# job if they skip.
#
# ffmpeg 7.1 pin history (measured 2026-11): the previous source, BtbN's
# FFmpeg-Builds pinned release FFmpeg-n7.1.1, is gone upstream — the repo moved
# to FFmpeg-Builds/FFmpeg-Builds and every versioned release was deleted.
# nixpkgs-by-revision is pinned AND served from cache.nixos.org, so this job
# no longer depends on any third party keeping old assets alive.
#
# Exit-code doctrine: pytest can segfault at interpreter shutdown (Qt offscreen
# teardown) AFTER printing a green summary. Suite steps write a junit XML and
# let tools/ci_result_guard.py judge the XML, tolerating only known teardown
# crash codes — see that file's docstring for the measured evidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ffmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: [distro, nix-7.1]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: External engines (system packages - the app bundles zero engines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qpdf pandoc poppler-utils ghostscript \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            lmodern \
            libreoffice-writer \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: "ffmpeg flavour: distro (apt build)"
        if: matrix.ffmpeg == 'distro'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: "ffmpeg flavour: nixpkgs (determinate nix installer)"
        if: matrix.ffmpeg == 'nix-7.1'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: "install rev-pinned nixpkgs ffmpeg_7 (7.1.5; binary cache serves it)"
        if: matrix.ffmpeg == 'nix-7.1'
        run: |
          set -euo pipefail
          # Rev = nixos-unstable HEAD verified 2026-11-20; ffmpeg_7 = 7.1.5 there
          # (nix eval of this exact rev printed "ffmpeg-7.1.5").
          nix profile install --accept-flake-config \
            'github:NixOS/nixpkgs/0bb8272318b4ca41bf0edc6224df3e3e3046b70d#ffmpeg_7'
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Show the engine matrix this job really has
        run: |
          set -euo pipefail
          command -v ffmpeg; ffmpeg -version | head -2
          command -v ffprobe
          qpdf --version | head -1
          pandoc --version | head -1
          pdftoppm -v 2>&1 | head -1 || true
          gs --version
          command -v pdflatex

      - name: Install the app (Python deps only; engines stay external)
        run: pip install -e ".[dev,gui,serve]"

      - name: Test suite (all tiers except slow)
        run: |
          rc=0; python -m pytest -q -m "not slow" --junitxml=results.xml || rc=$?
          python tools/ci_result_guard.py results.xml "$rc"

      - name: Real-engine coverage must RUN, not skip
        run: |
          rc=0; python -m pytest -q tests/test_real_external_engines.py --junitxml=real.xml || rc=$?
          python tools/ci_result_guard.py real.xml "$rc" --no-skips

  # P6 gate: the SAME suite goes green on Windows, and the Windows governor
  # load test (real Job Object, real busy-loop children, measured CPU) RUNS -
  # a step fails if it skips. Documented deviations on this runner:
  #  - no qpdf/pandoc (no enforced apt chain like Linux); real-engine tests
  #    skip honestly there and the zero-skip enforcement step is Linux-only.
  #    Local Windows QA with the full engine set stays on the roadmap.
  #  - ffmpeg/ghostscript ship on the GitHub Windows image; whatever the
  #    runtime probe finds is what the tests exercise (measure, don't parse).
  windows:
    name: Windows (Job Object governor)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provide ffmpeg (external engine; absent from current runner images)
        # conftest builds mp4/mp3/hdr fixtures with it; the tests skip honestly
        # without it, but CI must cover the product WITH the engine. Gyan build
        # via winget; its bin dir is exported through GITHUB_PATH for later steps.
        shell: pwsh
        run: |
          winget install -e --id Gyan.FFmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-Command ffmpeg -ErrorAction SilentlyContinue }
          if ($exe) {
            $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            & $exe.FullName -version | Select-Object -First 1 | ForEach-Object { "::notice::ffmpeg ready: $($_)" }
          } else { "::error::ffmpeg install FAILED - mp4-dependent tests will skip, not fail" }

      - name: Install the app (Python deps only; engines stay external)
        run: pip install -e ".[dev,gui,serve]"

      - name: Show what the runtime probe really finds (no assumptions)
        # Diagnostic only: whatever this prints, the suite must still run.
        # Each row is ALSO an annotation - the log is not readable via API.
        continue-on-error: true
        shell: pwsh
        run: |
          # pwsh here-string -> file -> python. No nested quoting under any
          # Windows shell. (The previous cmd.exe form of this step died with
          # exit 1 before pytest ever ran - every Windows red so far.)
          @'
          from transmute.probe.engines import EngineManager
          for r in EngineManager().status_table():
              print(r["name"], r["status"], r["path"], r["version"], sep=" | ")
          '@ | Set-Content -Encoding utf8 probe_show.py
          python probe_show.py | Tee-Object -FilePath probe_rows.txt
          Get-Content probe_rows.txt | ForEach-Object { "::notice::probe $_" }

      - name: Test suite (all tiers except slow)
        shell: pwsh
        run: |
          echo "::notice::win-suite reached"
          # Evidence chain: ws-a fired, if/else line vanished, w2 vanished,
          # w3 fired: pytest's unterminated stdout byte-line SWALLOWED the
          # next annotation (runner watches stdout line-starts). And the
          # wrapper python died WITHOUT writing pytest_rc.txt even though
          # pwsh continued - so the wrapper died during subprocess.run.
          # Countermeasures: (1) pytest touches NO runner pipe at all - all
          # output to file, tail re-emitted by us; (2) wrap_alive.txt written
          # BEFORE pytest starts: alive+no-rc proves mid-run wrapper death.
          # BREAKTHROUGH run 44810470963: pytest PASSED to ~50% then died
          # mid-line (heap-corruption abort - test poisoning on Windows).
          # w2's pwsh echo is eaten by the death (python echoes survive -
          # proven) so progress reports via a FILE: breadcrumb.txt holds the
          # last step name, echoed by the guard and the tail python. Also
          # -p no:cacheprovider: removing pytest's end-of-session cache write
          # gives a crashing interpreter one less way to die AFTER the green
          # junit xml exists.
          @'
          import os, subprocess, sys
          def crumb(s):
              open("breadcrumb.txt", "w").write(s)
          crumb("wrapper-start")
          env = dict(os.environ, PYTHONFAULTHANDLER="1")
          with open("pytest_out.txt", "wb") as out:
              crumb("pytest-spawning")
              try:
                  rc = subprocess.run([sys.executable, "-u", "-m", "pytest",
                                       "-v", "--tb=line",
                                       "-m", "not slow",
                                       "-p", "no:cacheprovider",
                                       "-p", "faulthandler",
                                       "--junitxml=results.xml"],
                                      stdout=out, stderr=subprocess.STDOUT,
                                      timeout=1500, env=env).returncode
              except subprocess.TimeoutExpired:
                  rc = 124
              crumb("pytest-done rc=%d" % rc)
          open("pytest_rc.txt", "w").write(str(rc & 0xFFFFFFFF))
          crumb("rc-file-written")
          '@ | Set-Content -Encoding utf8 win_pytest_wrapper.py
          echo "::notice::w1 toolver=$(python --version 2>&1) guardbytes=$((Get-Item tools/ci_result_guard.py).Length)"
          python win_pytest_wrapper.py
          python -c "import pathlib; print('::notice::w2x crumb=' + (pathlib.Path('breadcrumb.txt').read_text() if pathlib.Path('breadcrumb.txt').exists() else 'NONE'))"
          python -c "import pathlib; d=pathlib.Path('pytest_out.txt').read_bytes() if pathlib.Path('pytest_out.txt').exists() else b''; k=d.find(b'Windows fatal exception'); k=k if k>=0 else d.find(b'Current thread'); k=k if k>=0 else max(0,len(d)-1300); print('::error::pytest tail: ' + repr(d[k:][:3000])[:3200])"
          python tools/ci_result_guard.py results.xml (Get-Content pytest_rc.txt -ErrorAction SilentlyContinue) pytest_out.txt
          echo "::notice::w3 guard-exit=$LASTEXITCODE"

      - name: Governor load test - real Job Object cap must RUN and hold
        shell: pwsh
        timeout-minutes: 12
        run: |
          echo "::notice::win-governor reached"
          @'
          import subprocess, sys
          open("governor_alive.txt", "w").write("1")
          with open("wjo_out.txt", "wb") as out:
              try:
                  rc = subprocess.run([sys.executable, "-u", "-m", "pytest", "-q",
                                       "tests/test_governor_windows.py",
                                       "--junitxml=wjo.xml"],
                                      stdout=out, stderr=subprocess.STDOUT,
                                      timeout=600).returncode
              except subprocess.TimeoutExpired:
                  rc = 124
          open("wjo_rc.txt", "w").write(str(rc & 0xFFFFFFFF))
          '@ | Set-Content -Encoding utf8 win_governor_wrapper.py
          echo "::notice::g1 file-bytes=$((Get-Item win_governor_wrapper.py -ErrorAction SilentlyContinue).Length)"
          python win_governor_wrapper.py
          echo "::notice::g2 pyexit=$LASTEXITCODE alive=$(Test-Path governor_alive.txt) rcfile=$(Test-Path wjo_rc.txt)"
          # --no-skips: on a real runner (unlike a nested-Job container) attach
          # succeeds, so every governor test must actually run here.
          python tools/ci_result_guard.py wjo.xml (Get-Content wjo_rc.txt -ErrorAction SilentlyContinue) wjo_out.txt --no-skips
          echo "::notice::g3 guard-exit=$LASTEXITCODE"
