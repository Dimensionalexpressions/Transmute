name: Release build

# Builds the SHIPPABLE artifacts from a tagged commit and publishes them to
# the matching GitHub release + ghcr.io - all authenticated by the workflow's
# own GITHUB_TOKEN, so no personal tokens are involved anywhere.
#
# Honesty contract (same doctrine as the tests):
#   * binaries are built on the SAME runner OS family that our green test
#     matrix validated (Linux job = ubuntu, Windows job = windows-latest);
#   * every artifact is smoke-RUN before upload: the frozen GUI must start
#     and keep its Qt event loop alive headless, or the job goes red and
#     nothing is published from it;
#   * engines stay EXTERNAL: nothing is faked into the bundle; the app
#     probes PATH and reports honestly, exactly as documented.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag (with a published release) to rebuild"
        default: "v0.2.0"

permissions:
  contents: write   # gh release upload
  packages: write   # ghcr.io push

jobs:
  binary-linux:
    runs-on: ubuntu-24.04          # glibc floor of the tarball: 2.39 (Ubuntu 24.04)
    # NOTE: builds the commit that TRIGGERED the run (tag push) or the
    # dispatched branch (workflow_dispatch); inputs.tag only names the
    # release to attach to and the docker tag - never a silent checkout
    # of some other commit.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build-only tools (PyInstaller is NEVER a runtime dep)
        run: |
          # System GL/X/DBus/font libs are BUILD-side inputs: they exist in the
          # build env so PyInstaller collects them INTO the bundle, making the
          # tarball self-contained (verified smoke-free on pristine 24.04).
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
          python -m pip install -U pip
          # Essentials only: src/ imports nothing beyond QtCore/QtGui/QtWidgets.
          python -m pip install -e . PySide6-Essentials pyinstaller
      - name: Freeze (onedir - relocatable, no onefile extraction games)
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed \
            --name Transmute --collect-all transmute \
            packaging/launch_gui.py
      - name: Smoke - frozen GUI on ubuntu:24.04 + the documented GL floor
        # PyInstaller deliberately does NOT bundle the OpenGL stack
        # (depend/dylib.py _unix_excludes: "graphical interface libraries
        # come with graphical stack (see libglvnd)") - because bundling GL
        # dispatch over a machine's real GPU drivers is the classic breakage.
        # Qt assumes the same. So the documented floor is glibc >= 2.39 +
        # libGL/libEGL: present on every desktop Linux; headless boxes need
        # `sudo apt install libgl1 libegl1` (README says exactly this).
        # Nothing else may be installed for the smoke: any other missing
        # library is a bundle regression and fails the job.
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e QT_QPA_PLATFORM=offscreen ubuntu:24.04 \
            bash -c 'apt-get update -qq >/dev/null 2>&1 || echo APT-UPDATE-FAIL; \
              apt-get install -y -qq --no-install-recommends libgl1 libegl1 >/dev/null 2>&1 || echo APT-INSTALL-FAIL; \
              /dist/Transmute/Transmute >/tmp/smoke.log 2>&1 & P=$!; sleep 12; \
              if kill -0 $P 2>/dev/null; then echo SMOKE-ALIVE; kill $P; \
              else wait $P; echo "DIED-RC=$?"; fi; echo --LOG--; tail -c 420 /tmp/smoke.log' \
            > /tmp/psmoke.out 2>&1 || true
          if grep -q SMOKE-ALIVE /tmp/psmoke.out; then
            echo "::notice::2404 + GL floor: GUI alive"
          else
            MSG=$(tr '\n' '~' < /tmp/psmoke.out | tail -c 380 | tr ':' '-' | tr '%' 'P')
            echo "::error::2404 smoke died: $MSG"
            exit 1
          fi
      - name: Frozen smoke - engines+serve via --smoke on the runner
        # same gate as Windows: the frozen Linux binary must detect engines,
        # start serve, answer HTTP, stop cleanly - or the release stops here.
        run: |
          REQ=""
          command -v soffice >/dev/null 2>&1 && REQ="libreoffice"
          QT_QPA_PLATFORM=offscreen TRANSMUTE_SMOKE_ENGINES="$REQ" \
            ./dist/Transmute/Transmute --smoke; RC=$?
          cat dist/Transmute/transmute-smoke.log 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then echo "::error::frozen smoke failed (rc $RC)"; exit 1; fi
      - name: Pack + checksum
        run: |
          tar -C dist -czf Transmute-linux-x86_64.tar.gz Transmute
          sha256sum Transmute-linux-x86_64.tar.gz > SHA256SUMS.linux
          cat SHA256SUMS.linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            Transmute-linux-x86_64.tar.gz
            SHA256SUMS.linux

  binary-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build-only tools
        run: |
          python -m pip install -U pip
          python -m pip install -e . PySide6-Essentials pyinstaller
      - name: Provide LibreOffice for the smoke (external engine; never bundled)
        # winget exit 0x8A15002B (-1978335189) = already installed = success
        shell: pwsh
        run: |
          winget install -e --id TheDocumentFoundation.LibreOffice --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) { exit $LASTEXITCODE }
      - name: Freeze (onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Transmute --collect-all transmute packaging/launch_gui.py
      - name: Smoke - frozen build must probe, serve and stay alive before shipping
        # 2026-11 proved "it starts" is not enough: v0.2.5 started fine yet
        # its LibreOffice probe popped console windows demanding Enter, and
        # serve stuck itself off. --smoke (transmute/selfcheck.py) runs the
        # FROZEN build's own probe/serve/governor code paths; a nonzero exit
        # here stops the release before any zip is packed.
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:TRANSMUTE_SMOKE_ENGINES = "libreoffice"
          $s = Start-Process -FilePath "dist\Transmute\Transmute.exe" -ArgumentList "--smoke" -Wait -PassThru
          if (Test-Path dist\Transmute\transmute-smoke.log) {
            Get-Content dist\Transmute\transmute-smoke.log
          }
          if ($s.ExitCode -ne 0) {
            "::error::frozen smoke FAILED (exit $($s.ExitCode)) - broken in the exact build we would ship"
            exit 1
          }
          $p = Start-Process -FilePath "dist\Transmute\Transmute.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) {
            "::error::frozen exe exited early (code $($p.ExitCode))"
            exit 1
          }
          "::notice::frozen smoke OK; windows GUI alive after 15s"
          Stop-Process -Id $p.Id
      - name: Pack + checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Transmute -DestinationPath Transmute-windows-x86_64.zip
          $h = (Get-FileHash -Algorithm SHA256 Transmute-windows-x86_64.zip).Hash.ToLower()
          "$h  Transmute-windows-x86_64.zip" | Set-Content -Encoding ascii SHA256SUMS.windows
          Get-Content SHA256SUMS.windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            Transmute-windows-x86_64.zip
            SHA256SUMS.windows

  docker:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # ghcr paths must be lowercase; the org login is fixed, hardcode rather
      # than invent lowercase expressions that could silently break.
      IMG: ghcr.io/dimensionalexpressions/transmute-serve
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io with the workflow token
        # docker/login-action is the canonical ghcr credential path; raw
        # `docker login` succeeded but the push was still DENIED - use the
        # supported action and, if denied again, surface the registry's
        # FULL error (previous annotation truncated it to "denied").
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build serve image (linux/amd64; documented, no false multi-arch)
        run: |
          if ! docker build -f docker/Dockerfile -t "$IMG:$TAG" -t "$IMG:latest" . >/tmp/db.log 2>&1; then
            echo "::error::docker build failed: $(tail -c 450 /tmp/db.log | tr '\n' '~' | tr ':' '-')"
            exit 1
          fi
      - name: Smoke before publish
        run: |
          if ! docker run -d --name tm-smoke -e TRANSMUTE_TOKEN=*** -p 127.0.0.1:18765:8765 "$IMG:$TAG" >/tmp/dr.log 2>&1; then
            echo "::error::docker run failed: $(tr '\n' '~' </tmp/dr.log | cut -c1-450 | tr ':' '-')"
            exit 1
          fi
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18765/ || echo curlfail)
          if [ "$code" != "200" ]; then
            echo "::error::serve smoke got $code logs $(docker logs tm-smoke 2>&1 | tail -c 450 | tr '\n' '~' | tr ':' '-')"
            docker rm -f tm-smoke >/dev/null
            exit 1
          fi
          docker rm -f tm-smoke >/dev/null
          echo "::notice::serve smoke 200 OK"
      - name: Push
        run: |
          san() { tail -c 600 "$1" | grep -a -iE 'denied|error|unauthorized|manifest' | tail -c 380 | tr '\n' '~' | tr ':' '-' | tr '%' 'P'; }
          if ! docker push "$IMG:$TAG" >/tmp/dp.log 2>&1; then
            echo "::error::push $TAG denied-full: $(san /tmp/dp.log)"
            exit 1
          fi
          if ! docker push "$IMG:latest" >>/tmp/dp.log 2>&1; then
            echo "::error::push latest denied-full: $(san /tmp/dp.log)"
            exit 1
          fi
          echo "::notice::image published $IMG:$TAG (+latest)"

  upload:
    needs: [binary-linux, binary-windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-binary"
          merge-multiple: true
      - name: Attach to the published GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No checkout in this job -> gh cannot infer the repo from a
          # git remote; every gh call must carry --repo explicitly.
          # (First failure of this job died silently on exactly this.)
          if ! ls Transmute-linux-x86_64.tar.gz Transmute-windows-x86_64.zip \
                  SHA256SUMS.linux SHA256SUMS.windows >/dev/null 2>&1; then
            echo "::error::artifacts missing after download: $(ls -la | tr '\n' '~' | tr ':' '-')"
            exit 1
          fi
          cat > /tmp/relnotes.md <<'NOTES'
          Alpha release. **Engines are NOT bundled** — Transmute drives FFmpeg,
          Ghostscript, qpdf, Poppler, LibreOffice and pandoc installed on your own
          machine (each under its own license; see `THIRD-PARTY-NOTICES.md` in this
          repository for full credits, licenses and links — with thanks to every
          upstream project).

          Install the engines once:

          - Windows (PowerShell): `winget install Gyan.FFmpeg`, `winget install QPDF.QPDF`,
            `winget install oschwartz10612.Poppler`, `winget install JohnMacFarlane.Pandoc`,
            `winget install TheDocumentFoundation.LibreOffice`; Ghostscript via its official
            `.msi` from https://ghostscript.com/releases/gsdnld.html
          - Linux: your package manager (`ffmpeg ghostscript qpdf poppler-utils pandoc libreoffice`)
          - Nix flake and Docker image: engines already baked in

          Missing engines? In the app, click **"Get and install a missing engine…"** —
          Transmute runs your machine's own package manager (winget) or opens the tool's
          official download page, always after showing you the exact command and license,
          then re-checks automatically. It never bundles an engine.

          Verify downloads against `SHA256SUMS.txt`. Alpha binaries are unsigned;
          SmartScreen's "unknown publisher" warning is expected.
          NOTES
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>/tmp/gh1.err; then
            echo "::notice::no release for $TAG yet - creating it (prerelease)"
            if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
                --title "Transmute $TAG" --notes-file /tmp/relnotes.md 2>/tmp/gh2.err; then
              echo "::error::release create failed: $(tr '\n' '~' </tmp/gh2.err | tr ':' '-' | tail -c 380)"
              exit 1
            fi
          else
            if ! gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/relnotes.md 2>/tmp/gh1b.err; then
              echo "::error::release edit failed: $(tr '\n' '~' </tmp/gh1b.err | tr ':' '-' | tail -c 380)"
              exit 1
            fi
          fi
          cat SHA256SUMS.linux SHA256SUMS.windows > SHA256SUMS.txt
          if ! gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
              Transmute-linux-x86_64.tar.gz \
              Transmute-windows-x86_64.zip \
              SHA256SUMS.txt --clobber 2>/tmp/gh3.err; then
            echo "::error::release upload failed: $(tr '\n' '~' </tmp/gh3.err | tr ':' '-' | tail -c 380)"
            exit 1
          fi
          echo "::notice::release assets attached to $TAG"
